services:
  ownshelf:
    build: .
    container_name: ownshelf
    ports:
      - "7788:7788"
    volumes:
      - ./data:/app/data
      # 改成你自己的漫画目录（绿联 NAS 通常是 /volume1/共享文件夹名）
      # 必须可读写：程序需要删除漫画文件夹、写回 ComicInfo.xml
      - /volume1/comics:/comics
    environment:
      - COMICS_DIR=/comics
      - DB_PATH=/app/data/ownshelf.db
      - COVERS_DIR=/app/data/covers
      - HOST=0.0.0.0
      - PORT=7788
      - JWT_SECRET=change-me-in-production
      # 可选：开启访问密码（改成你自己的密码后再去掉注释）
      # - AUTH_ENABLED=true
      # - AUTH_PASSWORD=your-password
      - PUID=1000
      - PGID=100
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    restart: unless-stopped
