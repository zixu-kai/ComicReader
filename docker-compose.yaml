services:
  ownshelf:
    image: ghcr.io/zixu-kai/comicreader:latest
    container_name: ownshelf
    pull_policy: always
    ports:
      - "7788:7788"
    volumes:
      - ./data:/app/data
      # 漫画目录必须可读写：程序需要删除漫画文件夹、写回 ComicInfo.xml
      - /volume1/comics:/comics
    environment:
      - COMICS_DIR=/comics
      - DB_PATH=/app/data/ownshelf.db
      - COVERS_DIR=/app/data/covers
      - HOST=0.0.0.0
      - PORT=7788
      - JWT_SECRET=change-me-in-production
      # 可选：开启访问密码（改成你自己的密码后再设为 true）
      # - AUTH_ENABLED=true
      # - AUTH_PASSWORD=your-password
      - PUID=1000
      - PGID=100
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    restart: unless-stopped